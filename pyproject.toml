[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uta"
version = "1.11.1"
description = "Universal Task Agent - 本地学习型 Agent 框架"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UTA Team"},
]
keywords = ["agent", "llm", "rag", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pytest>=8.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "numpy>=2.0.0",
    "certifi>=2024.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0.0",
    "pyinstaller>=6.0.0",
]
dev = [
    "ruff>=0.5.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
uta = "main:main"
uta-api = "api.server:main"
uta-desktop = "desktop.app:main"
uta-eval = "evals.runner:main"
uta-rag-eval = "rag.benchmark:main"

[tool.setuptools.packages.find]
include = ["api*", "core*", "desktop*", "evals*", "llm*", "memory_providers*", "rag*", "search_providers*", "skills*", "tools*", "weather_providers*"]

[tool.pytest.ini_options]
markers = [
    "integration: 需要真实模型或网络的集成测试（默认跳过，手动 -m integration 运行）",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"
